# ─────────────────────────────────────────────────────────────────────────────
# WheatGuard AI – Docker Compose
# Usage:  docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: wheatguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Copy values from .env in the back/ directory
      APP_NAME: "WheatGuard AI"
      APP_ENV: production
      DEBUG: "false"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      ALLOWED_ORIGINS: "http://localhost:3000,http://frontend:3000"
      # Supabase – set these in your shell environment or a .env file
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Model
      MODEL_PATH: models/best_model.pth
      CLASS_NAMES_PATH: models/class_names.json
      CONFIDENCE_THRESHOLD: "0.60"
      DEVICE: cpu
      MAX_UPLOAD_SIZE_MB: "10"
      LOG_LEVEL: INFO
    volumes:
      # Mount model weights and data from host so they persist
      - ./back/models:/app/models
      - ./back/data:/app/data
      - ./back/artifacts:/app/artifacts
      - ./back/logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    container_name: wheatguard-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: wheatguard-network
